[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmserver"
version = "0.1.0"
description = "Local Tetra Master protocol and game server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
postgres = ["SQLAlchemy==2.0.54", "alembic==1.20.0", "psycopg[binary]==3.3.6"]
dev = ["ruff==0.16.4", "build>=1.2,<2"]

[project.scripts]
tmserver = "tmserver.run_server:main"
tmserver-db = "tmserver.database:cli"
tmserver-play = "tmserver.local_play:main"
tmserver-admin = "tmserver.admin:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmserver = ["data/*.json", "data/*.tsv", "migrations/*.py", "migrations/versions/*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["research", "var", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
