[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmserver"
version = "0.1.0"
description = "Unofficial server for the PC version of Tetra Master"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic==2.13.5", "construct==2.10.70"]
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/sruon/tmserver"
Issues = "https://github.com/sruon/tmserver/issues"

[project.optional-dependencies]
admin = ["starlette-admin==1.0.3", "starlette==1.10.0", "uvicorn==0.54.0"]
auth = ["starlette==1.10.0", "uvicorn==0.54.0", "httpx==0.28.1", "websockets==17.4"]
postgres = [
    "SQLAlchemy==2.1.6", "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
]
dev = ["ruff==0.16.9", "build>=1.2,<2", "httpx==0.28.1"]

[project.scripts]
tmserver = "tmserver.cli.serve:main"
tmserver-db = "tmserver.storage.database:cli"
tmserver-admin = "tmserver.cli.admin:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmserver = ["data/*.json", "storage/migrations/*.py", "storage/migrations/versions/*.py", "admin/templates/*.html"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["research", "var", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
