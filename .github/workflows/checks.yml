name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,admin,postgres]"
      - run: python -m ruff check src tests tools
      - run: python -m tools.check_collection

  lanes:
    name: ${{ matrix.lane }} lane (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: portable, os: ubuntu-latest, extras: dev}
          - {lane: portable, os: windows-latest, extras: dev}
          - {lane: admin, os: ubuntu-latest, extras: "dev,admin"}
          - {lane: postgres, os: ubuntu-latest, extras: "dev,postgres"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m tools.check_tests "${{ matrix.lane }}"

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m build --wheel
      - run: python -m tools.check_wheel dist/*.whl --admin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmserver-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  required:
    name: All checks
    if: always()
    needs: [quality, lanes, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
