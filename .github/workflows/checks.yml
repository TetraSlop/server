name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python -m tools.check_collection
      - run: python -m tools.check_tests portable
      - run: python -m tools.build_wheel
      - run: python -m tools.check_wheel dist/tmserver-0.1.0-py3-none-any.whl

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,postgres]"
      - run: python -m tools.check_tests postgres
