name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, package, container, admin and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,admin,postgres]"
      - run: python -m build --wheel
      - run: python -m tools.check_wheel dist/*.whl --admin
      # After the wheel, so test imports cannot leave bytecode for it to package.
      - run: python -m ruff check src tests tools
      - run: python -m tools.check_collection
      - run: python -m tools.check_tests admin
      - run: python -m tools.check_tests postgres
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tmserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start PostgreSQL and the server container
        env:
          TM_IMAGE: tmserver:ci
          # Host port 0: Docker picks free ports, so nothing else on the runner can collide.
          TM_GAME_PORT: 0
          TM_PROFILE_PORT: 0
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Register and sign in through the published game port
        run: |
          port=$(docker compose port server 51241)
          python -m tools.check_container --port "${port##*:}"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  portable:
    name: portable lane ${{ matrix.shard }}/6
    strategy:
      fail-fast: false
      matrix:
        # Shards are balanced by tools/test_durations.json.
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m tools.check_tests portable --shard ${{ matrix.shard }}/6

  required:
    name: All checks
    if: always()
    needs: [quality, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
