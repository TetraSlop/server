version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      web:
        patterns: [starlette, starlette-admin, uvicorn, httpx, websockets]
      postgres:
        patterns: [SQLAlchemy, alembic, psycopg]
